# Upstream servers for all microservices
upstream case_management {            # Case Management Service
    server admin-case-management:8001; # EXPOSE 8001
}

upstream agreement_management {       # Agreement Management Service
    server admin-agreement-management:8007; # EXPOSE 8007
}

upstream client_management {          # Client Management Service
    server admin-client-management:8005; # EXPOSE 8005
}

upstream client_registration {        # Client Registration & Auth (Unified Auth)
    server admin-client-registration:8000; # EXPOSE 8000
}

upstream document_management {        # Document Management Service
    server admin-document-management:8004; # EXPOSE 8004
}

upstream hearing_management {         # Hearings Management Service
    server admin-hearing-management:8002; # EXPOSE 8002
}

upstream invoice_management {         # Invoice Management Service
    server admin-invoice-management:8008; # EXPOSE 8008
}

upstream judgment_management {        # Judgment Management Service
    server admin-judgment-management:8003; # EXPOSE 8003
}

upstream permission_management {      # Permission Management Service
    server admin-permission-management:8010; # EXPOSE 8010
}

upstream staff_management {           # Staff Management Service
    server admin-staff-management:8006; # EXPOSE 8006
}

upstream staff_ai_classification {    # AI Classification Service
    server staff-ai-classification:8011; # EXPOSE 8011
}

upstream staff_ai_prediction {        # AI Verdict Prediction Service
    server staff-ai-prediction:8013; # EXPOSE 8013
}

upstream staff_ai_summarization {     # AI Summarization Service
    server staff-ai-summarization:8012; # EXPOSE 8012
}

upstream staff_ai_chatbot {           # AI Chatbot Service
    server staff-ai-chatbot:8014; # EXPOSE 8014
}

upstream staff_ai_drafting {          # AI Document Drafting / Rental Agreements Service
    server staff-ai-drafting:8015; # EXPOSE 8015
}

# Rate limiting
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

server {
    listen 80;
    server_name _;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    # Client max body size for file uploads
    client_max_body_size 100M;
    
    # Frontend static files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # API Gateway Routes
    
    # Case Management API
    location /api/v1/cases {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://case_management/api/v1/cases;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # Client Management API (separate microservice)
    location /api/v1/clients {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://client_management/api/v1/clients;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Staff Management API (corrected to point to staff service)
    location /api/v1/staff/ {
        limit_req zone=api burst=20 nodelay;
        # Preserve path after /api/v1/staff/
        proxy_pass http://staff_management/api/v1/staff/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Staff Auth endpoints (e.g., /api/v1/staff-auth/verify)
    location /api/v1/staff-auth/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://staff_management/api/v1/staff-auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Agreement Management API
    location /api/v1/agreements {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://agreement_management/api/v1/agreements;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Client Management API
    location /api/v1/client-management {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://client_management/api/v1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Client Registration & Auth API
    location /api/v1/auth {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://client_registration;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location /api/v1/registration {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://client_registration;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Document Management API
    location /api/v1/documents {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://document_management/api/v1/documents;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Increase timeout for file uploads
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Hearing Management API
    location /api/v1/hearings {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://hearing_management/api/v1/hearings;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Invoice Management API
    location /api/v1/invoices {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://invoice_management/api/v1/invoices;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Judgment Management API
    location /api/v1/judgments {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://judgment_management/api/v1/judgments;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Permission Management API
    # Use trailing slash form to preserve subpaths (e.g., /api/v1/permissions/?query)
    location /api/v1/permissions/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://permission_management/api/v1/permissions/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Staff Management API
    # location /api/v1/staff-management {
    #     limit_req zone=api burst=20 nodelay;
    #     proxy_pass http://staff_management/api/v1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
    
    # AI Services
    
    # Case Classification AI (service exposes /api/classification/* internally)
    location /api/v1/classification/ {
        limit_req zone=api burst=10 nodelay;
        # Preserve path after /api/v1/classification/
        proxy_pass http://staff_ai_classification/api/classification/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Case Prediction AI (service root has /upload_pdf/ & /verdict_prediction/ directly)
    location /api/v1/prediction/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://staff_ai_prediction/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Case Summarization AI (service root has /upload_pdf/, /summarize/, /summarize_text/)
    location /api/v1/summarization/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://staff_ai_summarization/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
    
    # Legal Chatbot AI (align under /api/v1/chat/ for consistency)
    location /api/v1/chat/ {
        limit_req zone=api burst=15 nodelay;
        proxy_pass http://staff_ai_chatbot;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Document Drafting AI (align under /api/v1/drafting/)
    location /api/v1/drafting/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://staff_ai_drafting/api/drafting/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Lease Agreements API (optional separate route to same drafting service)
    location /api/v1/lease_agreements/ {
        limit_req zone=api burst=10 nodelay;
        # Pass through to the drafting service internal API path (ensure backend router matches)
        proxy_pass http://staff_ai_drafting/api/v1/lease_agreements/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
    
    # Health checks for all services
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Fallback for unmatched API routes
    location /api/ {
        return 404 '{"error": "API endpoint not found"}';
        add_header Content-Type application/json;
    }
    
    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}